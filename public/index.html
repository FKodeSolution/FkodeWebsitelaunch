<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- =========================
         BASIC META
    ========================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#0f172a"
    />

    <meta
      name="description"
      content="FKode Solution is a complete business solution provider offering branding, software development, digital marketing and business registration services."
    />

    <meta
      name="author"
      content="FKode Solution"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =========================
         FAVICON
    ========================== -->

    <!-- Primary favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="%PUBLIC_URL%/Fkode.ico"
    />

    <!-- PNG favicon fallback -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Apple / iPhone icon -->
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- =========================
         WEB APP MANIFEST
    ========================== -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- =========================
         OPEN GRAPH
         WhatsApp / Facebook / Social Preview
    ========================== -->

    <meta
      property="og:title"
      content="FKode Solution | Complete Business Solution Provider"
    />

    <meta
      property="og:description"
      content="Complete Business Solution Provider – Branding, Software Development, Digital Marketing and Business Registration."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fkodesolution.com/"
    />

    <meta
      property="og:image"
      content="https://fkodesolution.com/logo512.png"
    />

    <meta
      property="og:image:alt"
      content="FKode Solution Logo"
    />

    <!-- =========================
         TWITTER / X CARD
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FKode Solution | Complete Business Solution Provider"
    />

    <meta
      name="twitter:description"
      content="Complete Business Solution Provider – Branding, Software Development, Digital Marketing and Business Registration."
    />

    <meta
      name="twitter:image"
      content="https://fkodesolution.com/logo512.png"
    />

    <!-- =========================
         TITLE
    ========================== -->

    <title>
      FKode Solution | Complete Business Solution Provider
    </title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
